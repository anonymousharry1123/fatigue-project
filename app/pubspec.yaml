name: app
description: "Tonyo — a private, explainable fatigue and energy coach."
publish_to: 'none'
version: 0.35.0+37

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  shared_preferences: ^2.5.3
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/synthetic_students.csv
    - assets/fonts/README.md
    - assets/fonts/SHA256SUMS.txt
    - assets/fonts/inter/OFL.txt
    - assets/fonts/source_sans_3/OFL.txt
    - assets/fonts/lato/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/source_sans_3/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/source_sans_3/SourceSans3-Medium.ttf
          weight: 500
        - asset: assets/fonts/source_sans_3/SourceSans3-Semibold.ttf
          weight: 600
        - asset: assets/fonts/source_sans_3/SourceSans3-Bold.ttf
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/fonts/lato/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/lato/Lato-Medium.ttf
          weight: 500
        - asset: assets/fonts/lato/Lato-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/lato/Lato-Bold.ttf
          weight: 700
